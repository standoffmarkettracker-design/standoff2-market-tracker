name: Test Discord Webhook

on:
  workflow_dispatch:

jobs:
  test-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: A/B test the webhook User-Agent
        run: |
          python - <<'PYEOF'
          import json, re, urllib.request, urllib.error

          src = open("scripts/check_doubles.py").read()
          url = re.search(r'DISCORD_WEBHOOK = "([^"]+)"', src).group(1)
          print("webhook id:", url.split("/")[-2][:12], "(token hidden)")

          def post(label, headers):
              body = json.dumps({"content": "Webhook test - " + label}).encode()
              req = urllib.request.Request(url, data=body, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("RESULT [" + label + "]: HTTP " + str(r.status) + " -> message delivered")
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", "replace")[:200]
                  print("RESULT [" + label + "]: HTTP " + str(e.code) + " -> " + detail)
              except Exception as e:
                  print("RESULT [" + label + "]: " + repr(e))

          post("OLD default urllib User-Agent", {"Content-Type": "application/json"})
          post("NEW explicit User-Agent", {
              "Content-Type": "application/json",
              "User-Agent": "StandoffMarketTracker-Bot/1.0 (+https://standoff2markettracker.com)",
          })
          PYEOF
