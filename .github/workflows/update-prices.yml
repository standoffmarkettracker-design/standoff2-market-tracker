name: Price Update (Every 6 Hours)

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: price-update
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run price update script
        run: python scripts/update_prices.py

      # Posts when a swing item enters its buy or sell zone, ranks buy urgency,
      # announces new swing items, and writes swing_state.json + swing_data.json.
      # Uses the SWING_WEBHOOK secret if it exists, otherwise DISCORD_WEBHOOK.
      - name: Swing alerts (buy and sell zones)
        run: python scripts/swing_alerts.py
        env:
          SWING_WEBHOOK: ${{ secrets.SWING_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true

      - name: Commit and push if data changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add items.json price_history_real_1.json price_history_real_2.json collections.json flip_data.json
          git add swing_state.json swing_data.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: price update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force-with-lease

      - name: Alert Discord on price doubles
        run: python scripts/check_doubles.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true
